name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.0.0). Defaults to YYYYMMDD.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          } elseif ("${{ inputs.version }}" -ne "") {
            $v = "${{ inputs.version }}"
          } else {
            $v = (Get-Date -Format "yyyyMMdd")
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ---------- FFmpeg (MSYS2 / MinGW-w64 x64) ----------
      # Static-link GCC/winpthread/zlib so the DLLs have no MinGW runtime dependencies.

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-bzip2
            make
            diffutils

      - name: Ensure cross-prefix tools are available
        shell: msys2 {0}
        run: |
          for t in nm ar ranlib strip as dlltool; do
            dst="/mingw64/bin/x86_64-w64-mingw32-${t}.exe"
            src="/mingw64/bin/${t}.exe"
            [ -e "$dst" ] || ( [ -e "$src" ] && ln -sf "$src" "$dst" )
          done
          x86_64-w64-mingw32-nm --version

      - name: Remove dynamic import libs to force static linking
        shell: msys2 {0}
        run: |
          # Without these import libs, -lz and -lwinpthread fall back to
          # libz.a and libwinpthread.a so the DLLs don't depend on zlib1.dll
          # or libwinpthread-1.dll at runtime.
          rm -f /mingw64/lib/libz.dll.a
          rm -f /mingw64/lib/libwinpthread.dll.a

      - name: Build FFmpeg x64
        shell: msys2 {0}
        run: |
          sh build_ffmpeg.sh x64
          if [ ! -f ffmpeg/libavutil/avconfig.h ]; then
            echo "::error::avconfig.h not found - FFmpeg configure failed"
            echo "=== configure output ==="
            cat ffmpeg/ffbuild/config.out || true
            exit 1
          fi
          # libwinpthread-1.dll cannot be eliminated via static linking because
          # libwinpthread.a itself references the DLL.  Copy it alongside the
          # FFmpeg DLLs so the package is self-contained.
          cp /mingw64/bin/libwinpthread-1.dll bin_x64/

      # ---------- libaribcaption (CMake / MSVC) ----------

      - name: Build libaribcaption
        shell: cmd
        run: build_libaribcaption.bat

      # ---------- ARIBSplitter (MSBuild) ----------

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build ARIBSplitter x64
        shell: cmd
        run: MSBuild.exe demuxer\LAVSplitter\LAVSplitter.vcxproj /nologo /m /t:Rebuild /property:Configuration=Release;Platform=x64;SolutionDir=%CD%\

      - name: Verify ARIB debug logging is disabled by default
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectFiles = @(
            "demuxer\Demuxers\Demuxers.vcxproj",
            "demuxer\LAVSplitter\LAVSplitter.vcxproj"
          )
          foreach ($file in $projectFiles) {
            [xml]$project = Get-Content -LiteralPath $file
            $defs = $project.Project.ItemDefinitionGroup.ClCompile.PreprocessorDefinitions
            foreach ($def in $defs) {
              if ($def -match '(^|;)ARIB_DEBUG_LOG($|[;=])') {
                throw "ARIB_DEBUG_LOG is enabled in $file"
              }
            }
          }

          $binary = "bin_x64\ARIBSplitter.ax"
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Build output was not found: $binary"
          }

          $text = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($binary))
          $forbidden = @("arib_debug.log")
          foreach ($needle in $forbidden) {
            if ($text.Contains($needle)) {
              throw "Release binary contains ARIB debug log marker: $needle"
            }
          }

          $ini = Get-Content -LiteralPath "settings\ARIBSplitter.ini" -Raw
          if ($ini -notmatch '(?m)^DebugLogPath=\s*$') {
            throw "Release INI must keep DebugLogPath empty by default."
          }
          if ($ini -notmatch '(?m)^VerboseLog=0\s*$') {
            throw "Release INI must keep VerboseLog=0 by default."
          }

      # ---------- Package ----------

      - name: Create release package
        shell: pwsh
        run: .\make_release_package.ps1 -Version "${{ steps.ver.outputs.VERSION }}" -Platform x64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ARIBSplitter-${{ steps.ver.outputs.VERSION }}-x64
          path: dist/*.zip

      # ---------- GitHub Release (tag push only) ----------

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ARIBSplitter ${{ steps.ver.outputs.VERSION }}
          files: dist/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
