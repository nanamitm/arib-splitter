[ARIB]
; フォント名 (デフォルト: MS Gothic)
;FontName=MS Gothic

; 字幕の透過率: 0=不透明(デフォルト), 100=完全透明
CaptionTransparency=0

; 字幕背景の透過率: 0=不透明, 100=完全透明
; この項目を削除またはコメントアウトすると放送波のalpha値をそのまま使用
BackgroundTransparency=50

; 字幕背景の表示: 1=表示(デフォルト), 0=非表示
ShowBackground=1

; 文字の縁取り幅: 0=なし(デフォルト), 1-10=縁取りの太さ(ASS \bord 値)
OutlineWidth=0

; 字幕の表示遅延 (ミリ秒, 負値で早める): デフォルト 0
DelayMs=0

; かぎ括弧・二重かぎ括弧・隅付き括弧 (「」『』【】) はARIB放送で
; MSZ (半幅) として送信される。1=半幅で描画 (ARIBフォント向け, デフォルト)
;                               0=全幅で描画 (一般フォントで重なりを防ぐ)
AribBracketSquish=1

; ========================================
; DRCS (外字) 設定
; ========================================

; 未変換DRCS文字をBMPとして保存する: 1=保存する, 0=保存しない(デフォルト)
DRCSSaveBmp=0

; BMP保存先フォルダ (省略時はDLLと同じフォルダの .\DRCS)
; 相対パスはARIBSplitter.axと同じフォルダを基準とする
;DRCSSaveDir=.\DRCS

; ========================================
; DRCS 文字マッピング
; 保存されたBMPをユーザーが確認し、対応する文字を記入してください
; 書式: MD5ハッシュ(32文字)=置換後の文字列
; 変更後すぐ(約5秒以内)に反映されます
; ========================================
[DRCSMap]
;030B487AE68DA1F4DA98046F4FED390F=Ｎ
;4360DD96063CE1A9660CC8437E8238E3=?!

; ========================================
; スーパーインポーズ専用設定 (省略時は [ARIB] の値を継承)
; ========================================
[Superimpose]
;FontName=MS Gothic
;CaptionTransparency=0
;BackgroundTransparency=50
;ShowBackground=1
;OutlineWidth=0
;DelayMs=0
;DRCSSaveBmp=0
;DRCSSaveDir=.\DRCS
